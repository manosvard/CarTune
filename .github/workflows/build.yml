name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate app icon
        run: |
          pip3 install pillow --break-system-packages || pip3 install pillow
          python3 make_icon.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project CarTune.xcodeproj -scheme CarTune \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CarTune.app Payload/
          zip -qr CarTune.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CarTune-ipa
          path: CarTune.ipa
